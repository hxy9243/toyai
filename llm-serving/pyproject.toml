[project]
name = "llm-serving"
version = "0.1.0"
description = "Reproducible vLLM serving parameter sweep and evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "runpod>=1.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

[project.scripts]
llm-serving = "llm_serving.cli:main"
flash = "llm_serving.flash:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
