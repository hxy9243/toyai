schema_version: 1
name: qwen35-27b-bf16

model:
  id: Qwen/Qwen3.5-27B
  revision: main
  variant: BF16
  dtype: auto
  quantization: null
  model_card:
    url: https://huggingface.co/Qwen/Qwen3.5-27B
    config_url: https://huggingface.co/Qwen/Qwen3.5-27B/blob/main/config.json
    max_position_embeddings: 262144

parallelism:
  tensor_parallel: 1
  data_parallel: 1

server:
  # Serve the model's published 262144-token context window recorded in model_card.
  max_model_len: 262144
  gpu_memory_utilization: 0.90
  trust_remote_code: false
  startup_timeout_seconds: 3600
  extra_args: []

sweep:
  cuda_graphs: [true, false]
  # Qwen3.5 uses Mamba's aligned cache mode, which vLLM requires to run
  # with chunked prefill enabled.
  chunked_prefill: [true]
  repetitions: 1

# Omitting quality.tasks uses the standard lm-eval suite: LongBench v2, GSM8K,
# and SuperGLUE. Add `quality: {tasks: []}` to skip quality evaluation.
