schema_version: 1
name: gemma3-27b-it

model:
  id: google/gemma-3-27b-it
  revision: main
  variant: BF16
  dtype: auto
  quantization: null
  model_card:
    url: https://ai.google.dev/gemma/docs/core/model_card_3
    config_url: https://huggingface.co/google/gemma-3-27b-it/blob/main/config.json
    max_position_embeddings: 131072

parallelism:
  tensor_parallel: 1
  data_parallel: 1

server:
  # Serve Gemma's published 131072-token context window recorded in model_card.
  max_model_len: 131072
  gpu_memory_utilization: 0.90
  trust_remote_code: false
  startup_timeout_seconds: 3600
  extra_args: []

sweep:
  cuda_graphs: [true, false]
  chunked_prefill: [true, false]
  repetitions: 1

# Omitting quality.tasks uses the standard lm-eval suite: LongBench v2, GSM8K,
# and SuperGLUE. Add `quality: {tasks: []}` to skip quality evaluation.
