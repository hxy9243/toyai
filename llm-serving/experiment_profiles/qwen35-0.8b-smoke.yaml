schema_version: 1
name: qwen35-0.8b-smoke

model:
  id: Qwen/Qwen3.5-0.8B
  revision: main
  variant: BF16
  dtype: auto
  quantization: null
  model_card:
    url: https://huggingface.co/Qwen/Qwen3.5-0.8B
    config_url: https://huggingface.co/Qwen/Qwen3.5-0.8B/blob/main/config.json
    max_position_embeddings: 262144

parallelism:
  tensor_parallel: 1
  data_parallel: 1

server:
  # Serve the model's published 262144-token context window, recorded above
  # from the official configuration.
  max_model_len: 262144
  gpu_memory_utilization: 0.80
  trust_remote_code: false
  startup_timeout_seconds: 600
  extra_args: []

sweep:
  cuda_graphs: [true, false]
  # Qwen3.5 uses Mamba's aligned cache mode, which vLLM requires to run
  # with chunked prefill enabled.
  chunked_prefill: [true]
  repetitions: 1

quality:
  tasks:
    - name: longbench2
      limit: 20
    - name: gsm8k
      num_fewshot: 5
      limit: 20
    - name: super-glue-lm-eval-v1
      limit: 20
